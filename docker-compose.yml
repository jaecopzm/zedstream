services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zedstream
      POSTGRES_PASSWORD: zedstream_secret
      POSTGRES_DB: zedstream
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zedstream"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  migrate:
    image: migrate/migrate:4
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://zedstream:zedstream_secret@postgres:5432/zedstream?sslmode=disable"
      - "up"
    restart: no

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 128m

volumes:
  pgdata:
